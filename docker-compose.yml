services:
  mongo:
    image: mongo:7
    container_name: plantpals-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./backend
    container_name: plantpals-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # V Dockerju je baza dosegljiva pod imenom storitve "mongo".
      MONGO_URI: mongodb://mongo:27017/plantpals
    ports:
      - "3000:3000"
    depends_on:
      - mongo

volumes:
  mongo-data:
